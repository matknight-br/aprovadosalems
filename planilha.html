<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Aprovados | CAALEMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { institucional: { 50: '#f0f9ff', 100: '#e0f2fe', 600: '#0284c7', 800: '#075985', 900: '#0c4a6e' } } } } 
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col min-h-screen">

    <script src="header.js"></script>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8 transition-colors duration-300 w-full">
            
            <div class="mb-8">
                <h2 class="text-2xl md:text-3xl font-bold text-institucional-900 dark:text-institucional-100 mb-2">Lista de Aprovados por Cargo</h2>
                <p class="text-slate-600 dark:text-slate-300">Relação completa dos cargos e respectivos aprovados no Concurso Público.</p>
                <p class="text-slate-600 dark:text-slate-300">Para edição de suas informações, solicite acesso à planilha, que está presente <u><a href="https://docs.google.com/spreadsheets/d/1XsJUScpQLzBEv3Che1S-e-sC6FvTtV3C/edit?gid=1098950830#gid=1098950830">aqui</a></u></p>
            </div>

            <div class="relative w-full h-[600px] md:h-[800px] rounded-xl overflow-hidden border border-slate-300 dark:border-slate-600 bg-white">
                <iframe 
                    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJCVh6WFJ3LTZ3KkN0uBTm8XZjq1dwRXGZTMupEApZ7j7zN7_EoVL27crVNBFRQA/pubhtml?widget=true&amp;headers=false" 
                    class="absolute top-0 left-0 w-full h-full border-0"
                    title="Lista de Aprovados por Cargo">
                </iframe>
            </div>

            <div class="mt-4 text-center">
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJCVh6WFJ3LTZ3KkN0uBTm8XZjq1dwRXGZTMupEApZ7j7zN7_EoVL27crVNBFRQA/pubhtml?widget=true&amp;headers=false" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold text-institucional-600 dark:text-institucional-400 hover:underline">
                    Abrir lista em tela cheia <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
                </a>
            </div>
        </div>
    </main>

    <script src="rodape.js?v=2"></script>
</body>
</html>
